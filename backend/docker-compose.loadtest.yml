# Load test against a throwaway Postgres (never your real DATABASE_URL):
#   docker compose -p akipoly-loadtest -f docker-compose.loadtest.yml run --rm loadtest
#   docker compose -p akipoly-loadtest -f docker-compose.loadtest.yml down -v
# Own project name so it doesn't share a network with the real server. `name:`
# loses to COMPOSE_PROJECT_NAME, so the commands above pin it with -p too.
# Ran it before the rename? Remove the old db once, from backend/ (POSIX shell; README has
# the PowerShell form). Matches this compose file's path, not the project name:
#   docker ps -aq -f label=com.docker.compose.project.config_files="$PWD/docker-compose.loadtest.yml" -f label=com.docker.compose.service=db | xargs -r docker rm -fv
# The project name is set in 3 places that must change together: this `name:`,
# every `-p` above, and the loadtest section of README.md.
name: akipoly-loadtest
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: loadtest
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  loadtest:
    build:
      context: .
      target: build # the stage with dev deps (tsx) and sources
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:loadtest@db:5432/postgres
      LOADTEST_TABLES: ${LOADTEST_TABLES:-10}
      LOADTEST_PLAYERS: ${LOADTEST_PLAYERS:-10}
    command: ["npm", "run", "loadtest"]
